<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MMRPG Narrator Web</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1rem; display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
    .card { background: #1e293b; border-radius: 10px; padding: 1rem; }
    h1, h2 { margin-top: 0; }
    label, select, input, button { display: block; width: 100%; margin-bottom: 0.6rem; }
    select, input, button { padding: 0.55rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
    button { cursor: pointer; background: #2563eb; border: none; }
    #chatLog { height: 60vh; overflow-y: auto; background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 0.8rem; }
    .msg { margin-bottom: 0.8rem; white-space: pre-wrap; }
    .msg strong { color: #93c5fd; }
    .sys { color: #fbbf24; }
    .status { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>MMRPG Narrator Web</h1>
      <p class="status">Browse campaigns/sessions and run chat sessions.</p>
      <label for="campaign">Campaign</label>
      <select id="campaign"></select>
      <label for="sessionTitle">Session title</label>
      <input id="sessionTitle" placeholder="Session title">
      <button id="startBtn">Start New Session</button>

      <hr>
      <label for="resumeSession">Resume session</label>
      <select id="resumeSession"></select>
      <button id="resumeBtn">Resume Session</button>
      <label for="attachSessionId">Attach by session ID</label>
      <input id="attachSessionId" placeholder="Full session ID">
      <button id="attachBtn">Attach to Session</button>

      <p id="active" class="status">No active session.</p>
    </section>

    <section class="card">
      <h2>Chat</h2>
      <div id="chatLog"></div>
      <label for="chatInput">Message</label>
      <input id="chatInput" placeholder="Type an action, dialogue, or [meta direction]">
      <button id="sendBtn">Send</button>
    </section>
  </div>

  <script>
    let activeSessionId = null;
    let renderedLogCount = 0;
    let lastRecap = "";

    const campaignEl = document.getElementById("campaign");
    const resumeEl = document.getElementById("resumeSession");
    const chatLog = document.getElementById("chatLog");
    const activeLabel = document.getElementById("active");

    function appendLine(role, content, cls = "") {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      const label = document.createElement("strong");
      label.textContent = `${role}: `;
      div.appendChild(label);
      div.appendChild(document.createTextNode(content ?? ""));
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function setActiveStatus(session, isActive) {
      activeSessionId = session.id;
      const status = isActive ? "active" : "inactive";
      activeLabel.textContent = `Session: ${session.title} (${session.id.slice(0, 8)}) - ${status}`;
    }

    function renderLog(entries, reset = false) {
      if (reset || entries.length < renderedLogCount) {
        chatLog.replaceChildren();
        renderedLogCount = 0;
      }
      for (let i = renderedLogCount; i < entries.length; i += 1) {
        const entry = entries[i];
        appendLine(entry.role, entry.content);
      }
      renderedLogCount = entries.length;
    }

    async function fetchSessionState(reset = false) {
      if (!activeSessionId) return;
      const r = await fetch(`/web/session/${activeSessionId}`);
      const data = await r.json();
      if (!r.ok) {
        appendLine("System", data.detail || "Could not fetch session state", "sys");
        return;
      }
      setActiveStatus(data.session, data.is_active);
      renderLog(data.session.log, reset);
    }

    async function loadBootstrap() {
      const r = await fetch("/web/bootstrap");
      const data = await r.json();

      campaignEl.innerHTML = "";
      for (const c of data.campaigns) {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.id.slice(0, 8)})`;
        campaignEl.appendChild(opt);
      }

      resumeEl.innerHTML = "";
      for (const s of data.sessions) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = `${s.title} (${s.id.slice(0, 8)})`;
        resumeEl.appendChild(opt);
      }
    }

    async function startSession(payload) {
      const r = await fetch("/web/session/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await r.json();
      if (!r.ok) {
        appendLine("System", data.detail || "Could not start session", "sys");
        return;
      }

      activeSessionId = data.session.id;
      setActiveStatus(data.session, true);
      renderedLogCount = 0;
      lastRecap = data.recap || "";
      if (lastRecap) {
        chatLog.replaceChildren();
        appendLine("Previously", lastRecap, "sys");
        renderLog(data.session.log, false);
      } else {
        renderLog(data.session.log, true);
      }
      await loadBootstrap();
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!activeSessionId || !text) return;
      input.value = "";

      const r = await fetch(`/web/session/${activeSessionId}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await r.json();
      if (!r.ok) {
        appendLine("System", data.detail || "Chat error", "sys");
        return;
      }
      renderLog(data.log, false);
      await fetchSessionState(false);
    }

    document.getElementById("startBtn").addEventListener("click", async () => {
      await startSession({
        campaign_id: campaignEl.value,
        title: document.getElementById("sessionTitle").value || null,
      });
    });

    document.getElementById("resumeBtn").addEventListener("click", async () => {
      await startSession({ session_id: resumeEl.value });
    });

    document.getElementById("attachBtn").addEventListener("click", async () => {
      const attachInput = document.getElementById("attachSessionId");
      const id = attachInput.value.trim();
      if (!id) return;
      activeSessionId = id;
      renderedLogCount = 0;
      lastRecap = "";
      await fetchSessionState(true);
    });

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    setInterval(() => {
      fetchSessionState(false);
    }, 1500);

    loadBootstrap();
  </script>
</body>
</html>
